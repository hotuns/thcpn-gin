        items:
          type: array
          items: { $ref: "#/components/schemas/THCPNLatestAttributesResponse" }
        failures:
          type: array
          items: { $ref: "#/components/schemas/THCPNDeviceRuntimeFailure" }
        refreshed_at: { $ref: "#/components/schemas/Timestamp" }
    THCPNDeviceLog:
      type: object
      required:
        - id
        - uuid
        - path
        - file_name
        - date
        - created_at
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
        path:
          type: string
        file_name:
          type: string
        date:
          type: string
          format: date
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    THCPNDeviceLogListResponse:
      type: object
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/THCPNDeviceLog"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    THCPNDeviceLogAccessResponse:
      type: object
      required:
        - log
        - preview_kind
        - url
        - expires_at
      properties:
