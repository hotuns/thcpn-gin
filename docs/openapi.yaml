          description: Compatibility summary derived from `template_code`; do not use for authorization.
        template_code:
          type: string
          description: Built-in permission template used to prefill the explicit permission list, or `custom`.
        template_name:
          type: string
        permission_codes:
          type: array
          items:
            $ref: "#/components/schemas/PermissionCode"
        scope_type:
          $ref: "#/components/schemas/AccessGrantScopeType"
        scope_id:
          $ref: "#/components/schemas/UUID"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        parent_grant_id:
          $ref: "#/components/schemas/UUID"
          description: Source grant preserved when the invitation is accepted.
        invited_by:
          $ref: "#/components/schemas/UUID"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    InvitationListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
    CreateInvitationRequest:
      type: object
      required:
        - permission_codes
        - scope_type
        - scope_id
      oneOf:
        - required:
            - email
        - required:
            - phone
      properties:
        email:
          $ref: "#/components/schemas/Email"
        phone:
          $ref: "#/components/schemas/Phone"
        template_code:
          type: string
          description: Optional built-in template code used to prefill `permission_codes`; authorization still uses the submitted permission list.
          default: viewer
        permission_codes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PermissionCode"
        scope_type:
          $ref: "#/components/schemas/AccessGrantScopeType"
        scope_id:
          $ref: "#/components/schemas/UUID"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
    THCPNAttributeValue:
      type: object
      required:
        - raw_value
        - sampled_at
        - source_table
      properties:
        raw_value:
          type: string
        parsed_value:
          description: Numeric value or parsed ext_info JSON when available.
        sampled_at:
          $ref: "#/components/schemas/Timestamp"
        source_table:
          type: string
    THCPNLatestAttributesResponse:
      type: object
      required:
        - device_id
