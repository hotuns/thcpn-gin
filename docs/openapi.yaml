                  email: researcher@example.com
                  template_code: viewer
                  permission_codes:
                    - project.view
                    - site.view
                    - device.view
                    - telemetry.query
              byUserId:
                value:
                  user_id: 018fa0ec-9b6e-7a3d-9c7b-1d8b04f31988
                  template_code: researcher
                  permission_codes:
                    - project.view
                    - site.view
