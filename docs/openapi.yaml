          required: true
          schema:
            type: string
      responses:
        "200":
          description: Media object deleted from object storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaDeleteResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/admin/users:
    get:
      tags:
        - Admin
      security:
        - bearerAuth: []
      operationId: adminListUsers
      summary: List platform users
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled] } }
        - { name: verification, in: query, schema: { type: string, enum: [verified, unverified] } }
        - { name: mfa, in: query, schema: { type: string, enum: [enabled, disabled] } }
        - { name: locked, in: query, schema: { type: string, enum: [locked, unlocked] } }
        - { name: login_status, in: query, schema: { type: string, enum: [never, active] } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: User list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminCreateUser
      summary: Create a platform user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateUserRequest"
      responses:
        "201":
          description: User and one-time temporary password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemporaryPasswordResponse"
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/users/{user_id}:
    parameters:
      - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminGetUser
      summary: Get platform user details
      responses:
        "200":
          description: User details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminUpdateUser
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUpdateUserRequest" }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminDeleteUser
      summary: Delete a user when no business blockers exist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonRequest" }
      responses:
        "204": { description: User deleted. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/users/{user_id}/status:
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminUpdateUserStatus
      summary: Enable or disable a user
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserStatusRequest" }
      responses:
        "204": { description: Status updated. }
        "400": { $ref: "#/components/responses/InvalidArgument" }
  /api/v1/admin/users/{user_id}/sessions/revoke-all:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminRevokeUserSessions
      summary: Revoke all user sessions
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonRequest" }
      responses:
        "204": { description: Sessions revoked. }
  /api/v1/admin/users/{user_id}/unlock:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminUnlockUser
      summary: Unlock a user account
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonRequest" }
      responses:
        "204": { description: Account unlocked. }
  /api/v1/admin/users/{user_id}/mfa:
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminResetUserMFA
      summary: Reset user MFA
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonRequest" }
      responses:
        "204": { description: MFA reset. }
  /api/v1/admin/users/{user_id}/temporary-password:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminGenerateTemporaryPassword
      summary: Generate a one-time temporary password
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonRequest" }
      responses:
        "200":
          description: Temporary password, shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTemporaryPasswordOnlyResponse" }
  /api/v1/admin/users/{user_id}/deletion-check:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminCheckUserDeletion
      summary: Check user deletion blockers
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "200":
          description: Deletion blockers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDeletionCheck" }
  /api/v1/admin/users/{user_id}/workspaces:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminListUserWorkspaces
      summary: List user Workspace relations
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "200":
          description: Workspace relations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserWorkspaceListResponse" }
  /api/v1/admin/users/{user_id}/sessions:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminListUserSessions
      summary: List active user sessions
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "200":
          description: Active sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserSessionListResponse" }
  /api/v1/admin/users/{user_id}/activity:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminListUserActivity
      summary: List user activity and admin operations
      parameters:
        - { name: user_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: User activity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserActivityListResponse" }

  /api/v1/processing/processors:
    get:
      tags: [Processing]
      operationId: listProcessingProcessors
      summary: Synchronize and list built-in processing definitions
      security: [{ bearerAuth: [] }, { devUserHeader: [] }]
      responses:
        "200":
          description: Available versioned processors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessingProcessorListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/workspaces/{workspace_id}/processing-tasks:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [Processing]
      operationId: listProcessingTasks
      summary: List workspace processing tasks
      description: Requires `processing.view` on the workspace.
      security: [{ bearerAuth: [] }, { devUserHeader: [] }]
      responses:
        "200":
          description: Processing tasks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessingTaskListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      tags: [Processing]
      operationId: createProcessingTask
      summary: Create a versioned processing task
      description: Requires `processing.manage` on the workspace.
      security: [{ bearerAuth: [] }, { devUserHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProcessingTaskRequest" }
      responses:
        "201":
          description: Created task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessingTask" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /api/v1/workspaces/{workspace_id}/processing-tasks/{task_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - name: task_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
    get:
      tags: [Processing]
      operationId: getProcessingTask
      summary: Get a processing task and its input bindings
      security: [{ bearerAuth: [] }, { devUserHeader: [] }]
      responses:
        "200":
          description: Processing task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessingTask" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/workspaces/{workspace_id}/processing-tasks/{task_id}/status:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - name: task_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
    patch:
      tags: [Processing]
      operationId: updateProcessingTaskStatus
      summary: Activate, pause, or archive a processing task
      security: [{ bearerAuth: [] }, { devUserHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, paused, archived] }
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessingTask" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/workspaces/{workspace_id}/processing-results/{result_id}/download:
    get:
      tags: [Processing]
      operationId: downloadProcessingResult
      summary: Prepare a metered professional processing artifact download
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: workspace_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { name: result_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "200": { description: Temporary object URL. }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token returned by SMS or password login APIs.
    devUserHeader:
      type: apiKey
      in: header
      name: X-User-ID
      description: Development-only fallback authentication. Production should disable it.
  parameters:
    AdminReason:
      name: X-Admin-Reason
      in: header
      required: true
      schema:
        type: string
        minLength: 5
        maxLength: 300
      description: Reason recorded in the audit log for this system administrator operation.
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Workspace UUID.
    MemberID:
      name: member_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Workspace member UUID.
    ProjectID:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Project UUID.
    SiteID:
      name: site_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Site UUID.
    DeviceID:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Device UUID.
    DataStreamID:
      name: data_stream_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Data stream UUID.
    DataSourceID:
      name: data_source_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Data source UUID.
    DataStreamBindingID:
      name: binding_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Data stream binding UUID.
    DatasetID:
      name: dataset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Dataset UUID.
    ExportJobID:
      name: export_job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Export job UUID.
    AccessGrantID:
      name: access_grant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Access grant UUID.
    InvitationID:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Invitation UUID.
  responses:
    InvalidArgument:
      description: Invalid request argument or body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalid:
              value:
                error:
                  code: INVALID_ARGUMENT
                  message: invalid request body
                  request_id: req_123
    Unauthorized:
      description: Missing, invalid or inactive authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            unauthorized:
              value:
                error:
                  code: UNAUTHORIZED
                  message: invalid bearer token
                  request_id: req_123
    PermissionDenied:
      description: Authenticated user does not have the required permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            forbidden:
              value:
                error:
                  code: PERMISSION_DENIED
                  message: permission denied
                  request_id: req_123
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: workspace member not found
                  request_id: req_123
    Conflict:
      description: Request conflicts with existing data or invariants.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            conflict:
              value:
                error:
                  code: CONFLICT
                  message: phone or email already exists
                  request_id: req_123
    RateLimited:
      description: Request was rate-limited or the account is temporarily locked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            limited:
              value:
                error:
                  code: RATE_LIMITED
                  message: sms code requested too frequently
                  request_id: req_123
    DataSourceError:
      description: Device data source connection or query failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            dataSource:
              value:
                error:
                  code: DATA_SOURCE_ERROR
                  message: query telemetry data source
                  request_id: req_123
    Internal:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            internal:
              value:
                error:
                  code: INTERNAL
                  message: internal error
                  request_id: req_123
  schemas:
    StatusResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        request_id:
          type: string
    ErrorCode:
      type: string
      enum:
        - INVALID_ARGUMENT
        - UNAUTHORIZED
        - PERMISSION_DENIED
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - DATA_SOURCE_ERROR
        - INTERNAL
        - SERVICE_UNAVAILABLE
    UUID:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Phone:
      type: string
      description: Normalized phone number. Lightweight validation allows digits and an optional leading plus sign.
      examples:
        - "13800000000"
        - "+8613800000000"
    Email:
      type: string
      format: email
    UserStatus:
      type: string
      enum:
        - active
        - disabled
    WorkspaceStatus:
      type: string
      enum:
        - active
        - disabled
    ProjectStatus:
      type: string
      enum:
        - active
        - archived
    SiteStatus:
      type: string
      enum:
        - active
        - archived
    DeviceStatus:
      type: string
      enum:
        - active
        - disabled
        - retired
    DeviceLifecycleStatus:
      type: string
      enum:
        - inbound
        - installed
        - online
        - maintenance
        - repairing
        - retired
    DeviceTopologyRole:
      type: string
      enum:
        - standalone
        - gateway
        - gateway_node
        - camera
    DeviceCapabilityCode:
      type: string
      pattern: "^[a-z][a-z0-9_]{0,63}$"
    DeviceCapabilityDefinitionStatus:
      type: string
      enum:
        - active
        - disabled
    DeviceOperationType:
      type: string
      enum:
        - calibration
        - firmware_upgrade
    DeviceOperationStatus:
      type: string
      enum:
        - requested
        - running
        - success
        - failed
        - cancelled
    DataStreamType:
      type: string
      enum:
        - telemetry
        - image
        - video
        - audio
        - event
        - log
    DataStreamStatus:
      type: string
      enum:
        - active
        - disabled
        - archived
    DataSourceType:
      type: string
      description: Physical connection type for an internal device source instance. Runtime business dispatch is selected by `data_stream_bindings.adapter_code`.
      enum:
        - postgres
        - mysql
        - clickhouse
        - http_api
        - file
    DataSourceStatus:
      type: string
      enum:
        - active
        - disabled
        - archived
    DataStreamBindingPayloadType:
      type: string
      enum:
        - columns
        - json
        - media
    DataStreamBindingAdapterCode:
      type: string
      description: Adapter selected for this data stream binding. Generic adapters use table/field mapping; special adapters use `adapter_config`.
      enum:
        - generic_columns
        - generic_media
        - http_api
        - thcpn_legacy_mysql
    DataStreamBindingStatus:
      type: string
      enum:
        - active
        - disabled
        - archived
    MediaType:
      type: string
      enum:
        - image
        - video
        - audio
    DatasetDataType:
      type: string
      enum:
        - telemetry
        - image
        - video
        - audio
        - event
        - log
        - mixed
    DatasetStatus:
      type: string
      enum:
        - draft
        - locked
        - archived
        - published
    ExportResourceType:
      type: string
      enum:
        - device
        - device_batch
        - data_stream
        - dataset
        - media
    ExportType:
      type: string
      enum:
        - telemetry_csv
        - telemetry_excel
        - media_zip
        - dataset_zip
        - standard_station_zip
        - group_site_zip
        - carbon_station_zip
    ExportStatus:
      type: string
      enum:
        - pending
        - running
        - success
        - failed
        - expired
    DatasetSourceType:
      type: string
      enum:
        - device
        - data_stream
        - file
    MembershipStatus:
      type: string
      enum:
        - active
        - disabled
        - removed
    WorkspaceType:
      type: string
      enum:
        - personal
        - organization
    OrganizationType:
      type: string
      enum:
        - lab
        - institution
        - company
        - government
        - service_provider
        - other
    InternalMemberRoleCode:
      type: string
      enum:
        - owner
        - admin
        - project_manager
        - site_operator
        - data_manager
        - researcher
        - viewer
      description: Built-in permission template codes available to workspace members. Authorization uses explicit `permission_codes`.
    MemberScopeType:
      type: string
      enum:
        - workspace
        - project
        - site
        - device
        - dataset
      description: Scope types supported by internal workspace members. Owner members must use workspace scope.
    PermissionCode:
      type: string
      description: Stable permission code, such as `device.view` or `telemetry.query`.
    PermissionDefinition:
      type: object
      required:
        - code
        - name
        - resource_type
        - action
        - group
      properties:
        code:
          $ref: "#/components/schemas/PermissionCode"
        name:
          type: string
        resource_type:
          type: string
        action:
          type: string
        group:
          type: string
    PermissionGroup:
      type: object
      required:
        - code
        - name
        - codes
      properties:
        code:
          type: string
        name:
          type: string
        codes:
          type: array
          items:
            $ref: "#/components/schemas/PermissionCode"
    PermissionTemplate:
      type: object
      required:
        - code
        - name
        - permission_codes
      properties:
        code:
          type: string
        name:
          type: string
        permission_codes:
          type: array
          items:
            $ref: "#/components/schemas/PermissionCode"
    PermissionCatalogResponse:
      type: object
      required:
        - permissions
        - groups
        - templates
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionDefinition"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PermissionGroup"
        templates:
          type: array
          items:
            $ref: "#/components/schemas/PermissionTemplate"
    SendSmsRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          $ref: "#/components/schemas/Phone"
    SendSmsResponse:
      type: object
      required:
        - sent
        - expires_in
        - cooldown_seconds
      properties:
        sent:
          type: boolean
        expires_in:
          type: integer
          minimum: 1
          description: Verification code TTL in seconds.
