    parameters:
      - $ref: "#/components/parameters/AccessGrantID"
    delete:
      tags:
        - AccessGrants
      operationId: revokeAccessGrant
      summary: Revoke an active access grant
      description: Requires `share.revoke` on the grant scope, or `service_access.grant` for service engineer grants.
      security:
        - bearerAuth: []
        - devUserHeader: []
      responses:
        "200":
          description: Access grant revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessGrant"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/invitations:
    get:
      tags:
        - Invitations
      operationId: listInvitations
      summary: List invitations in a workspace
      description: Requires `share.view` permission in the target workspace.
      security:
        - bearerAuth: []
        - devUserHeader: []
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Invitations in the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationListResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags:
        - Invitations
      operationId: createInvitation
      summary: Invite an unregistered phone or email to a resource
      description: Creates a pending Invitation. The invitee can accept it after registering or logging in with the matching phone or email.
      security:
        - bearerAuth: []
        - devUserHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/invitations/mine:
    get:
      tags:
        - Invitations
      operationId: listMyInvitations
      summary: List pending invitations for the current user identity
      security:
        - bearerAuth: []
        - devUserHeader: []
      responses:
        "200":
          description: Pending invitations matching the current user's phone or email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/invitations/{invitation_id}/accept:
    parameters:
      - $ref: "#/components/parameters/InvitationID"
    post:
      tags:
        - Invitations
      operationId: acceptInvitation
      summary: Accept an invitation
      description: Converts a pending Invitation into an AccessGrant when the current user's phone or email matches the invitee identity.
      security:
        - bearerAuth: []
        - devUserHeader: []
      responses:
        "200":
          description: Invitation accepted and access grant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessGrant"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/invitations/{invitation_id}:
    parameters:
      - $ref: "#/components/parameters/InvitationID"
    delete:
      tags:
        - Invitations
      operationId: revokeInvitation
      summary: Revoke a pending invitation
      description: Requires `share.revoke` on the invitation scope, or `service_access.grant` for service engineer invitations.
      security:
        - bearerAuth: []
        - devUserHeader: []
      responses:
        "200":
          description: Invitation revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/audit-logs:
    get:
      tags:
        - AuditLogs
      operationId: listAuditLogs
      summary: List audit logs in a workspace
      description: Requires `audit.view` permission in the target workspace. Results are ordered by newest first.
      security:
        - bearerAuth: []
        - devUserHeader: []
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Audit logs in the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/media/download:
    get:
      tags:
        - Media
      operationId: prepareMediaDownload
      summary: Prepare a media download URL
      description: |
        Requires `media.download` on the media data stream. The token is issued by media list APIs and expires quickly.
        Successful and denied download attempts are written to audit logs.
      security:
        - bearerAuth: []
        - devUserHeader: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Temporary object download URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaDownloadResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token returned by SMS or password login APIs.
    devUserHeader:
      type: apiKey
      in: header
      name: X-User-ID
      description: Development-only fallback authentication. Production should disable it.
  parameters:
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Workspace UUID.
    MemberID:
      name: member_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Workspace member UUID.
    ProjectID:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Project UUID.
    SiteID:
      name: site_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Site UUID.
    DeviceID:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Device UUID.
    DataStreamID:
      name: data_stream_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Data stream UUID.
    DataSourceID:
      name: data_source_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Data source UUID.
    DataStreamBindingID:
      name: binding_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Data stream binding UUID.
    DatasetID:
      name: dataset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Dataset UUID.
    ExportJobID:
      name: export_job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Export job UUID.
    AccessGrantID:
      name: access_grant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Access grant UUID.
    InvitationID:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Invitation UUID.
  responses:
    InvalidArgument:
      description: Invalid request argument or body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalid:
              value:
                error:
                  code: INVALID_ARGUMENT
                  message: invalid request body
                  request_id: req_123
    Unauthorized:
      description: Missing, invalid or inactive authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            unauthorized:
              value:
                error:
                  code: UNAUTHORIZED
                  message: invalid bearer token
                  request_id: req_123
    PermissionDenied:
      description: Authenticated user does not have the required permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            forbidden:
              value:
                error:
                  code: PERMISSION_DENIED
                  message: permission denied
                  request_id: req_123
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: workspace member not found
                  request_id: req_123
    Conflict:
      description: Request conflicts with existing data or invariants.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            conflict:
              value:
                error:
                  code: CONFLICT
                  message: phone or email already exists
                  request_id: req_123
    RateLimited:
      description: Request was rate-limited or the account is temporarily locked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            limited:
              value:
                error:
                  code: RATE_LIMITED
                  message: sms code requested too frequently
                  request_id: req_123
    DataSourceError:
      description: Device data source connection or query failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            dataSource:
              value:
                error:
                  code: DATA_SOURCE_ERROR
                  message: query telemetry data source
                  request_id: req_123
    Internal:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            internal:
              value:
                error:
                  code: INTERNAL
                  message: internal error
                  request_id: req_123
  schemas:
    StatusResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        request_id:
          type: string
    ErrorCode:
      type: string
      enum:
        - INVALID_ARGUMENT
        - UNAUTHORIZED
        - PERMISSION_DENIED
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - DATA_SOURCE_ERROR
        - INTERNAL
        - SERVICE_UNAVAILABLE
    UUID:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Phone:
      type: string
      description: Normalized phone number. Lightweight validation allows digits and an optional leading plus sign.
      examples:
        - "13800000000"
        - "+8613800000000"
    Email:
      type: string
      format: email
    UserStatus:
      type: string
      enum:
        - active
        - disabled
    WorkspaceStatus:
      type: string
      enum:
        - active
        - disabled
    ProjectStatus:
      type: string
      enum:
        - active
        - archived
    SiteStatus:
      type: string
      enum:
        - active
        - archived
    DeviceStatus:
      type: string
      enum:
        - active
        - disabled
        - retired
    DeviceCapabilityCode:
      type: string
      enum:
        - telemetry
        - image_capture
        - video_stream
        - ptz_control
        - remote_command
        - configurable
        - calibratable
        - firmware_update
        - edge_storage
    DeviceOperationType:
      type: string
      enum:
        - calibration
        - firmware_upgrade
    DeviceOperationStatus:
      type: string
      enum:
        - requested
        - running
        - success
        - failed
        - cancelled
    DataStreamType:
      type: string
      enum:
        - telemetry
        - image
        - video
        - audio
        - event
        - log
    DataStreamStatus:
      type: string
      enum:
        - active
        - disabled
        - archived
    DataSourceType:
      type: string
      description: Metadata accepts the planned adapter types. Runtime query adapters currently support `postgres`, `mysql`, `clickhouse` and `http_api`.
      enum:
        - postgres
        - mysql
        - clickhouse
        - http_api
        - file
    DataSourceStatus:
      type: string
      enum:
        - active
        - disabled
        - archived
    DataStreamBindingPayloadType:
      type: string
      enum:
        - columns
        - json
        - media
    DataStreamBindingStatus:
      type: string
      enum:
        - active
        - disabled
        - archived
    MediaType:
      type: string
      enum:
        - image
        - video
        - audio
    DatasetDataType:
      type: string
      enum:
        - telemetry
        - image
        - video
        - audio
        - event
        - log
        - mixed
    DatasetStatus:
      type: string
      enum:
        - draft
        - locked
        - archived
        - published
    ExportResourceType:
      type: string
      enum:
        - device
        - data_stream
        - dataset
        - media
    ExportType:
      type: string
      enum:
        - telemetry_csv
        - telemetry_excel
        - media_zip
        - dataset_zip
    ExportStatus:
      type: string
      enum:
        - pending
        - running
        - success
        - failed
        - expired
    DatasetSourceType:
      type: string
      enum:
        - device
        - data_stream
        - file
    MembershipStatus:
      type: string
      enum:
        - active
        - disabled
        - removed
    WorkspaceType:
      type: string
      enum:
        - personal
        - organization
    OrganizationType:
      type: string
      enum:
        - lab
        - institution
        - company
        - government
        - service_provider
        - other
    InternalMemberRoleCode:
      type: string
      enum:
        - owner
        - admin
        - project_manager
        - site_operator
        - data_manager
        - researcher
        - viewer
      description: Roles allowed for workspace members. Shared and service roles are reserved for future AccessGrant flows.
    SendSmsRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          $ref: "#/components/schemas/Phone"
    SendSmsResponse:
      type: object
      required:
        - sent
        - expires_in
        - cooldown_seconds
      properties:
        sent:
          type: boolean
        expires_in:
          type: integer
          minimum: 1
          description: Verification code TTL in seconds.
        cooldown_seconds:
          type: integer
          minimum: 1
          description: Minimum seconds before another code can be requested for the same phone.
    SendCodeResponse:
      type: object
      required:
        - sent
        - expires_in
        - cooldown_seconds
      properties:
        sent:
          type: boolean
        expires_in:
          type: integer
          minimum: 1
          description: Verification code TTL in seconds.
        cooldown_seconds:
          type: integer
          minimum: 1
          description: Minimum seconds before another code can be requested for the same target.
    SendEmailVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          $ref: "#/components/schemas/Email"
    VerifyEmailRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          $ref: "#/components/schemas/Email"
        code:
          type: string
          pattern: ^[0-9]{6}$
          example: "123456"
    VerifyEmailResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
    SmsLoginRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          $ref: "#/components/schemas/Phone"
        code:
          type: string
          pattern: ^[0-9]{6}$
          example: "123456"
        mfa_code:
          type: string
          pattern: ^[0-9]{6}$
          description: Required when the existing user has TOTP MFA enabled.
          example: "654321"
        name:
          type: string
          description: Used as the display name when SMS login auto-registers a new user.
          example: 张三
    PasswordRegisterRequest:
      type: object
      required:
        - password
      anyOf:
        - required:
            - phone
        - required:
            - email
      properties:
        name:
          type: string
          example: 张三
        phone:
          $ref: "#/components/schemas/Phone"
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Must contain at least one letter and one digit.
          example: Str0ngPassword!
    PasswordLoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Phone number or email address.
          examples:
            - "13800000000"
            - zhangsan@example.com
        password:
          type: string
          format: password
          example: Str0ngPassword!
        mfa_code:
          type: string
          pattern: ^[0-9]{6}$
          description: Required when TOTP MFA is enabled for the account.
          example: "654321"
    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Opaque refresh token issued by login or refresh APIs.
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Optional refresh token to revoke along with the current access token.
    MfaStatusResponse:
      type: object
      required:
        - totp_enabled
      properties:
        totp_enabled:
          type: boolean
        totp_enabled_at:
          $ref: "#/components/schemas/Timestamp"
    TotpSetupResponse:
      type: object
      required:
        - secret
        - otpauth_uri
      properties:
        secret:
          type: string
          description: Base32 TOTP secret shown once for authenticator setup.
        otpauth_uri:
          type: string
          description: otpauth URI compatible with authenticator apps.
    MfaCodeRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
          example: "123456"
    LoginResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - refresh_expires_in
        - user
      properties:
        access_token:
          type: string
          description: JWT access token.
        refresh_token:
          type: string
          description: Opaque refresh token. Store securely and send only to `/api/v1/auth/refresh` or `/api/v1/auth/logout`.
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          format: int64
          description: Access token lifetime in seconds.
        refresh_expires_in:
          type: integer
          format: int64
          description: Refresh token lifetime in seconds.
        user:
          $ref: "#/components/schemas/UserProfile"
        created:
          type: boolean
          description: True when the request created a new user.
    AuthSession:
      type: object
      required:
        - id
        - expires_at
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        user_agent:
          type: string
        client_ip:
          type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
    AuthSessionListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuthSession"
    UserProfile:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
        phone:
          $ref: "#/components/schemas/Phone"
        email:
          $ref: "#/components/schemas/Email"
        status:
          $ref: "#/components/schemas/UserStatus"
        phone_verified_at:
          $ref: "#/components/schemas/Timestamp"
        email_verified_at:
          $ref: "#/components/schemas/Timestamp"
        last_login_at:
          $ref: "#/components/schemas/Timestamp"
    Actor:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
        phone:
          $ref: "#/components/schemas/Phone"
        email:
          $ref: "#/components/schemas/Email"
        status:
          $ref: "#/components/schemas/UserStatus"
        phone_verified_at:
          $ref: "#/components/schemas/Timestamp"
        email_verified_at:
          $ref: "#/components/schemas/Timestamp"
    MeResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/Actor"
    DevRegisterRequest:
      type: object
      anyOf:
        - required:
            - phone
        - required:
            - email
      properties:
        name:
          type: string
          example: 张三
        phone:
          $ref: "#/components/schemas/Phone"
        email:
          $ref: "#/components/schemas/Email"
    DevRegisterResponse:
      type: object
      required:
        - user
        - workspace
        - membership
      properties:
        user:
          $ref: "#/components/schemas/User"
        workspace:
          $ref: "#/components/schemas/Workspace"
        membership:
          $ref: "#/components/schemas/DevRegistrationMembership"
    User:
      type: object
      required:
        - id
        - name
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
        phone:
          $ref: "#/components/schemas/Phone"
        email:
          $ref: "#/components/schemas/Email"
        status:
          $ref: "#/components/schemas/UserStatus"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        phone_verified_at:
          $ref: "#/components/schemas/Timestamp"
        email_verified_at:
          $ref: "#/components/schemas/Timestamp"
        last_login_at:
          $ref: "#/components/schemas/Timestamp"
    Workspace:
      type: object
      required:
        - id
        - type
        - name
        - owner_user_id
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        type:
          $ref: "#/components/schemas/WorkspaceType"
        organization_type:
          $ref: "#/components/schemas/OrganizationType"
        name:
          type: string
