        - source_device
        - attributes
        - refreshed_at
      properties:
        device_id:
          $ref: "#/components/schemas/UUID"
        external_device_id:
          type: integer
          format: int64
        source_device:
          $ref: "#/components/schemas/THCPNSourceDeviceRuntime"
        attributes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/THCPNAttributeValue"
        refreshed_at:
          $ref: "#/components/schemas/Timestamp"
    THCPNSourceDeviceRuntime:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        iccid: { type: string }
        version: { type: string }
        status: { type: string }
        device_type: { type: string }
        active: { type: integer, format: int64 }
        sn: { type: string }
        uuid: { type: string }
        current_device_version: { type: string }
        lat: { type: number, format: double }
        lon: { type: number, format: double }
        alt: { type: number, format: double }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    THCPNDeviceRuntimeFailure:
      type: object
