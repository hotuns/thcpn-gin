  /api/v1/devices/{device_id}/telemetry:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      tags:
        - Telemetry
      operationId: queryDeviceTelemetry
      summary: Query telemetry series for a device
      description: |
        Requires `telemetry.view_history` on the device. The API reads only through audited DataStreamBinding metadata;
        callers provide a time range and limit, not table names, field names or raw SQL.
      security:
        - bearerAuth: []
        - devUserHeader: []
      parameters:
        - name: start_time
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Timestamp"
        - name: end_time
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Timestamp"
        - name: data_stream_ids
          in: query
          required: false
          description: Comma-separated telemetry DataStream UUIDs. When omitted, all active telemetry streams on the device are queried.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum raw points returned per series before adaptive sampling is used.
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 5000
        - name: adaptive
          in: query
          required: false
          description: Scan the complete time range and return raw points when within the limit, otherwise return time-bucket extrema.
          schema:
            type: boolean
            default: false
        - name: target_points
          in: query
          required: false
          description: Approximate maximum chart points per series in adaptive mode.
          schema:
            type: integer
            minimum: 2
            maximum: 5000
            default: 1000
      responses:
        "200":
          description: Telemetry series for active telemetry data streams on the device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryQueryResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/DataSourceError"
        "500":
          $ref: "#/components/responses/Internal"
