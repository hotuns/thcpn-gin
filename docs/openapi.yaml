  /api/v1/export-jobs:
    get:
      tags:
        - ExportJobs
      operationId: listExportJobs
      summary: List export jobs
      description: |
        With `mine=true`, returns export jobs requested by the current user. If `workspace_id` is also supplied, the user's jobs are limited to that workspace.
        Without `mine=true`, `workspace_id` is required and the caller needs `audit.view` in that workspace to inspect all export jobs.
        If neither `workspace_id` nor `mine` is supplied, the API defaults to `mine=true`.
      security:
        - bearerAuth: []
        - devUserHeader: []
      parameters:
        - name: workspace_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UUID"
        - name: mine
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Export jobs ordered by newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJobListResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags:
        - ExportJobs
      operationId: createExportJob
      summary: Create an export job
      description: |
        Creates an asynchronous export job in `pending` status and enqueues an Asynq export task for worker processing.
        `telemetry_csv` and `telemetry_excel` require `telemetry.export` on a device or data stream.
        `dataset_zip` requires `dataset.export` on a dataset.
        `media_zip` requires `media.download` on a device, data stream, or media data-stream alias. The worker writes the original media objects and `manifest.csv` into a ZIP.
        `telemetry_csv`, `telemetry_excel` and `media_zip` require `start_time` and `end_time`; these values are persisted in `request_config`.
        Creation success and permission-denied or service failures are written to audit logs.
      security:
        - bearerAuth: []
        - devUserHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExportJobRequest"
      responses:
        "201":
          description: Export job created in `pending` status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
