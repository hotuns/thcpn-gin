    post:
      tags:
        - Admin
      operationId: adminSyncTHCPNStandardStationDevice
      summary: Sync a THCPN standard station device into the system asset registry
      description: >
        Requires a valid administrator bearer token. Uses a system-level THCPN MySQL DataSource to read the external
        device and latest config, then creates or updates platform Device, DeviceSourceRef, DeviceConfigSnapshot,
        DataStreams and DataStreamBindings. The platform reads device metadata from the external row and keeps the
        synchronized asset unassigned until an admin assigns it through the system device asset APIs.
      security:
        - bearerAuth: []
        - devUserHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncTHCPNStandardStationRequest"
      responses:
        "200":
          description: THCPN standard station device synchronized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/THCPNStandardStationSyncResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/admin/data-sources/{data_source_id}/thcpn-standard-station/devices/sync-all:
    parameters:
      - $ref: "#/components/parameters/DataSourceID"
    post:
      tags:
        - Admin
      operationId: adminSyncAllTHCPNDevices
      summary: Sync all THCPN devices from the external devices table
      description: >
        Requires a valid administrator bearer token. Reads all non-deleted rows from the external THCPN MySQL
        `devices` and `cameras` tables plus active `gate_node` topology. Each asset is synchronized independently
        and the response reports partial failures. Devices and cameras remain unassigned to a Workspace.
      security:
        - bearerAuth: []
        - devUserHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Full THCPN device synchronization completed, possibly with per-device failures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAllTHCPNDevicesResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/admin/data-sources/{data_source_id}/thcpn-standard-station/gateways:
    parameters:
      - $ref: "#/components/parameters/DataSourceID"
    post:
      tags:
        - Admin
      operationId: adminSyncTHCPNGateway
      summary: Sync a THCPN gateway topology into the system asset registry
      description: >
        Requires a valid administrator bearer token. Reads `gate_node` for the external gateway, synchronizes
        the gateway and node devices as independent system assets, and stores gateway-node relations.
        Synchronization never assigns the gateway or nodes to a Workspace.
      security:
        - bearerAuth: []
        - devUserHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncTHCPNGatewayRequest"
      responses:
        "200":
          description: THCPN gateway topology synchronized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/THCPNGatewaySyncResult"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
