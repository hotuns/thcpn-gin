server:
  addr: ":8080"

logger:
  level: "info"
  format: "json"
  directory: "var/log/thcpn"
  retention_days: 30
  max_total_size_mb: 5120
  max_file_size_mb: 100
  sqlite_index: true

database:
  platform_dsn_env: "PLATFORM_DATABASE_DSN"
  platform_dsn: "postgres://thcpn:thcpn_dev_password@127.0.0.1:5432/thcpn_platform?sslmode=disable"

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

auth:
  jwt_secret_env: "JWT_SECRET"
  jwt_secret: "dev-insecure-change-me"
  admin_jwt_secret_env: "ADMIN_JWT_SECRET"
  admin_jwt_secret: "dev-admin-insecure-change-me"
  access_token_ttl_minutes: 1440
  refresh_token_ttl_days: 30
  dev_user_header_enabled: true
  dev_register_enabled: true
  password:
    min_length: 8
    max_length: 128
    failed_attempt_limit: 5
    lock_minutes: 15

sms:
  provider: "log"
  code_ttl_seconds: 300
  cooldown_seconds: 60
  daily_limit: 10
  max_verify_attempts: 5
  template_param_code_key: "code"
  aliyun:
    access_key_id_env: "ALIYUN_ACCESS_KEY_ID"
    access_key_secret_env: "ALIYUN_ACCESS_KEY_SECRET"
    sign_name_env: "ALIYUN_SMS_SIGN_NAME"
    template_code_env: "ALIYUN_SMS_TEMPLATE_CODE"
    endpoint: "dysmsapi.aliyuncs.com"

email:
  provider: "log"
  code_ttl_seconds: 300
  cooldown_seconds: 60
  daily_limit: 10
  max_verify_attempts: 5

object_store:
  provider: "oss"
  endpoint: "https://oss-cn-beijing.aliyuncs.com"
  bucket: "iot-platform"
  region: "cn-beijing"
  local_path: "var/objectstore"
  public_url_prefix: ""
  access_key_env: "OBJECT_STORE_ACCESS_KEY"
  secret_key_env: "OBJECT_STORE_SECRET_KEY"

query_limits:
  max_history_days: 31
  max_points: 5000
  max_media_page_size: 100

export:
  file_ttl_hours: 72
  max_rows: 100000

tracing:
  enabled: false
  service_name: "thcpn-gin"
  exporter: "stdout"
  endpoint: "localhost:4318"
  insecure: true

ezviz:
  app_key_env: "EZVIZ_APP_KEY"
  app_secret_env: "EZVIZ_APP_SECRET"
  open_api_domain: "https://open.ys7.com"
  access_token_ttl_seconds: 3600
