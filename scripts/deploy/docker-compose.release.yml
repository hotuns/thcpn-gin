# Optional production overlay; merge after the existing production/prebuilt files.
# Frontend distributions must be built from the release commit into .deploy/frontend.
services:
  worker:
    environment:
      EXPORT_TEMP_DIR: /var/lib/thcpn/export-tmp
      EXPORT_MIN_FREE_MB: ${EXPORT_MIN_FREE_MB:-256}
      EXPORT_MAX_CONCURRENT_JOBS: ${EXPORT_MAX_CONCURRENT_JOBS:-1}
    volumes:
      - export_tmp:/var/lib/thcpn/export-tmp
  platform:
    build:
      dockerfile: .deploy/Dockerfile.frontend-prebuilt
      target: platform
  admin:
    build:
      dockerfile: .deploy/Dockerfile.frontend-prebuilt
      target: admin
volumes:
  export_tmp:
