# Run with --env-file var/simplified-local/.env from the repository root.
name: thcpn-simplified
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: thcpn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: thcpn_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U thcpn -d thcpn_platform']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  migrate-init:
    image: migrate/migrate:v4.17.1
    volumes:
      - ../../var/simplified-local/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: [-path=/migrations, '-database=${PLATFORM_DATABASE_DSN:?required}', up]
  processor:
    image: ${PROCESSOR_IMAGE:-thcpn-gin-processor:latest}
    environment:
      PROCESSOR_ARTIFACT_DIR: /var/lib/thcpn-processor/artifacts
    volumes:
      - processor_artifacts:/var/lib/thcpn-processor/artifacts
    restart: unless-stopped
  api:
    image: thcpn-simplified-backend:${DEPLOY_VERSION:?required}
    build:
      context: ../../var/simplified-local
      dockerfile: Dockerfile.prebuilt
      target: backend
    command: [api]
    env_file: ../../var/simplified-local/.env
    ports: ['127.0.0.1:${API_PORT:-18082}:8080']
    depends_on:
      migrate-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      processor:
        condition: service_started
    networks: [default, lorawan]
    volumes: &backend_volumes
      - objectstore_data:/var/lib/thcpn/objectstore
      - platform_logs:/var/log/thcpn
      - processor_artifacts:/var/lib/thcpn-processor/artifacts
      - export_tmp:/var/lib/thcpn/export-tmp
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/readyz']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  worker:
    image: thcpn-simplified-backend:${DEPLOY_VERSION:?required}
    command: [worker]
    env_file: ../../var/simplified-local/.env
    depends_on:
      api:
        condition: service_healthy
    networks: [default, lorawan]
    volumes: *backend_volumes
    restart: unless-stopped
  admin:
    image: thcpn-simplified-admin:${DEPLOY_VERSION:?required}
    build:
      context: ../../var/simplified-local
      dockerfile: Dockerfile.prebuilt
      target: admin
    ports: ['127.0.0.1:${ADMIN_PORT:-15174}:80']
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  platform:
    image: thcpn-simplified-platform:${DEPLOY_VERSION:?required}
    build:
      context: ../../var/simplified-local
      dockerfile: Dockerfile.prebuilt
      target: platform
    ports: ['127.0.0.1:${PLATFORM_PORT:-15173}:80']
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_started
    restart: unless-stopped
networks:
  lorawan:
    external: true
    name: ${LORAWAN_NETWORK:-lorawan-local_default}
volumes:
  postgres_data:
  redis_data:
  objectstore_data:
  platform_logs:
  processor_artifacts:
  export_tmp:
