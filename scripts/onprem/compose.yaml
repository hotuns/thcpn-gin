name: ieswatch-lite

x-backend-env: &backend_env
  SERVER_ADDR: ":8080"
  DEPLOYMENT_PROFILE: "onprem-lite"
  DEPLOYMENT_WORKSPACE_ID: "${DEPLOYMENT_WORKSPACE_ID}"
  PLATFORM_PUBLIC_URL: "${PLATFORM_PUBLIC_URL:-}"
  PLATFORM_DATABASE_DSN: "postgres://${POSTGRES_USER:-thcpn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thcpn_platform}?sslmode=disable"
  REDIS_ADDR: "redis:6379"
  REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
  REDIS_DB: "${REDIS_DB:-0}"
  LOGGER_DIRECTORY: "/var/log/thcpn"
  OBJECT_STORE_PROVIDER: "local"
  OBJECT_STORE_LOCAL_PATH: "/var/lib/thcpn/objectstore"
  OBJECT_STORE_BUCKET: "${OBJECT_STORE_BUCKET:-ieswatch-local}"
  EXPORT_TEMP_DIR: "/var/lib/thcpn/export-tmp"
  EXPORT_MIN_FREE_MB: "${EXPORT_MIN_FREE_MB:-256}"
  EXPORT_MAX_CONCURRENT_JOBS: "${EXPORT_MAX_CONCURRENT_JOBS:-1}"
  JWT_SECRET: "${JWT_SECRET}"
  ADMIN_JWT_SECRET: "${ADMIN_JWT_SECRET}"
  AUTH_DEV_USER_HEADER_ENABLED: "false"
  AUTH_DEV_REGISTER_ENABLED: "false"
  BILLING_ENABLED: "false"
  SMS_PROVIDER: "noop"
  EMAIL_PROVIDER: "noop"
  EZVIZ_APP_KEY: "${EZVIZ_APP_KEY:-}"
  EZVIZ_APP_SECRET: "${EZVIZ_APP_SECRET:-}"
  THCPN_LOG_OSS_PROVIDER: "${THCPN_LOG_OSS_PROVIDER:-local}"
  THCPN_LOG_OSS_ENDPOINT: "${THCPN_LOG_OSS_ENDPOINT:-}"
  THCPN_LOG_OSS_BUCKET: "${THCPN_LOG_OSS_BUCKET:-ieswatch-local}"
  THCPN_LOG_OSS_PUBLIC_URL_PREFIX: "${THCPN_LOG_OSS_PUBLIC_URL_PREFIX:-/api/v1/local-objects}"
  THCPN_LOG_OSS_ACCESS_KEY_ID: "${THCPN_LOG_OSS_ACCESS_KEY_ID:-}"
  THCPN_LOG_OSS_ACCESS_KEY_SECRET: "${THCPN_LOG_OSS_ACCESS_KEY_SECRET:-}"
  LORAWAN_V2_OSS_PROVIDER: "${LORAWAN_V2_OSS_PROVIDER:-local}"
  LORAWAN_V2_OSS_ENDPOINT: "${LORAWAN_V2_OSS_ENDPOINT:-}"
  LORAWAN_V2_OSS_BUCKET: "${LORAWAN_V2_OSS_BUCKET:-ieswatch-local}"
  LORAWAN_V2_OSS_PUBLIC_URL_PREFIX: "${LORAWAN_V2_OSS_PUBLIC_URL_PREFIX:-/api/v1/local-objects}"
  LORAWAN_V2_OSS_ACCESS_KEY_ID: "${LORAWAN_V2_OSS_ACCESS_KEY_ID:-}"
  LORAWAN_V2_OSS_ACCESS_KEY_SECRET: "${LORAWAN_V2_OSS_ACCESS_KEY_SECRET:-}"
  CARBON_OSS_PROVIDER: "${CARBON_OSS_PROVIDER:-local}"
  CARBON_OSS_ENDPOINT: "${CARBON_OSS_ENDPOINT:-}"
  CARBON_OSS_BUCKET: "${CARBON_OSS_BUCKET:-ieswatch-local}"
  CARBON_OSS_PUBLIC_URL_PREFIX: "${CARBON_OSS_PUBLIC_URL_PREFIX:-/api/v1/local-objects}"
  CARBON_OSS_ACCESS_KEY_ID: "${CARBON_OSS_ACCESS_KEY_ID:-}"
  CARBON_OSS_ACCESS_KEY_SECRET: "${CARBON_OSS_ACCESS_KEY_SECRET:-}"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thcpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-thcpn_platform}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-thcpn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thcpn_platform}?sslmode=disable"
      - "up"

  bootstrap:
    image: ${IESWATCH_IMAGE:-ieswatch-lite:latest}
    build:
      context: ../..
      dockerfile: Dockerfile
    profiles: ["tools"]
    entrypoint: ["adminctl", "onprem-init"]
    environment:
      <<: *backend_env
      INIT_WORKSPACE_NAME: "${INIT_WORKSPACE_NAME:-默认观测站}"
      INIT_ADMIN_NAME: "${INIT_ADMIN_NAME:-系统管理员}"
      INIT_ADMIN_EMAIL: "${INIT_ADMIN_EMAIL}"
      INIT_ADMIN_PASSWORD: "${INIT_ADMIN_PASSWORD}"
      INIT_USER_NAME: "${INIT_USER_NAME:-平台用户}"
      INIT_USER_EMAIL: "${INIT_USER_EMAIL:-}"
      INIT_USER_PASSWORD: "${INIT_USER_PASSWORD:-}"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${IESWATCH_IMAGE:-ieswatch-lite:latest}
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["api"]
    environment: *backend_env
    volumes:
      - ./data/objects:/var/lib/thcpn/objectstore
      - ./data/logs:/var/log/thcpn
      - ./data/export-tmp:/var/lib/thcpn/export-tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    image: ${IESWATCH_IMAGE:-ieswatch-lite:latest}
    command: ["worker"]
    environment: *backend_env
    volumes:
      - ./data/objects:/var/lib/thcpn/objectstore
      - ./data/logs:/var/log/thcpn
      - ./data/export-tmp:/var/lib/thcpn/export-tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: caddy:2-alpine
    ports:
      - "${SITE_BIND_IP:-0.0.0.0}:${SITE_WEB_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
