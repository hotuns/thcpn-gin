resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

# Compose recreates containers with new IPs; keep the service name dynamic.
upstream thcpn_api {
    zone thcpn_api 64k;
    server api:8080 resolve;
}

upstream thcpn_admin {
    zone thcpn_admin 64k;
    server admin:80 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://thcpn_api;
        proxy_read_timeout 1800s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://thcpn_api;
    }

    location /admin/ {
        proxy_pass http://thcpn_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
